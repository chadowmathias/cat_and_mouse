name: Build iOS IPA (No Mac Required)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: 🍏 Compiler l'application iOS
    runs-on: macos-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v4

      - name: 🎯 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 🛠️ Créer un projet Flutter propre avec Xcode
        run: |
          # Créer un projet Flutter vierge avec toute la structure iOS générée
          flutter create --platforms=ios --org com.catmouse catmouse_build
          
          # Copier nos fichiers source dans le projet généré
          cp -r mobile/lib/* catmouse_build/lib/
          cp mobile/pubspec.yaml catmouse_build/pubspec.yaml
          
          # Copier les permissions iOS (Info.plist)
          cp mobile/ios/Runner/Info.plist catmouse_build/ios/Runner/Info.plist
          
          cd catmouse_build
          flutter pub get

      - name: 🛠️ Compiler l'application iOS (Release sans signature)
        run: |
          cd catmouse_build
          flutter build ios --release --no-codesign

      - name: 📦 Packager le fichier .IPA pour Sideloadly / AltStore
        run: |
          cd catmouse_build
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r cat_and_mouse.ipa Payload
          mv cat_and_mouse.ipa ../

      - name: 📤 Mettre à disposition le fichier .IPA en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: cat_and_mouse_ios_ipa
          path: cat_and_mouse.ipa
          retention-days: 7
